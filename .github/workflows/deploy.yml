name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Sync files to EC2 via SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USERNAME }}
          # Destination directory configured in Nginx (/var/www/stock-watchlist)
          TARGET: "/var/www/stock-watchlist"
          # Exclude node_modules/git to save transfer time
          EXCLUDE: "/node_modules/, /.git/"
          # Restart server services after copying files
          SCRIPT_AFTER: |
            sudo systemctl reload nginx
            pm2 restart all || true
