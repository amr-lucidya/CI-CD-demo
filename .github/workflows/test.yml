name: Test Project

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run type checks
        run: npm run type-check
      - name: Run tests
        run: npm run test
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Run build
        run: npm run build

